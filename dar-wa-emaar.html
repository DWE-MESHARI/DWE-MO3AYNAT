<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دار وإعمار | نظام المعاينات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --orange-900:#a8460c;
  --orange-700:#d4630f;
  --orange-600:#ee7a1f;
  --orange-500:#f5891f;
  --orange-400:#fda856;
  --orange-100:#fdead6;
  --orange-50:#fff6ee;
  --ink-900:#141d27;
  --ink-800:#1c2733;
  --ink-700:#2b3947;
  --ink-500:#5a6b7a;
  --ink-300:#95a4b1;
  --ink-100:#e4e9ed;
  --paper:#ffffff;
  --canvas:#fbfaf8;
  --line: rgba(20,29,39,.09);
  --shadow-1: 0 1px 2px rgba(20,29,39,.06), 0 1px 1px rgba(20,29,39,.04);
  --shadow-2: 0 12px 30px -10px rgba(20,29,39,.18);
  --shadow-3: 0 24px 60px -20px rgba(20,29,39,.28);
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 24px;
  --font-head: 'Almarai', 'Tajawal', sans-serif;
  --font-body: 'Tajawal', sans-serif;
  --ease: cubic-bezier(.22,.7,.24,1);
}
/* Brand identity is fixed orange & white by design request — no dark-mode auto-switch */
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family: var(--font-body);
  background: var(--canvas);
  color: var(--ink-800);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--orange-400); color:#fff;}
img{max-width:100%; display:block;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit; text-decoration:none;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--ink-100); border-radius:10px;}
:focus-visible{outline:2px solid var(--orange-500); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

.hidden{display:none !important;}

/* ============ APP SHELL ============ */
#app{display:flex; min-height:100vh;}

.sidebar{
  width:240px; flex-shrink:0;
  background:var(--ink-900);
  color:#fff;
  display:flex; flex-direction:column;
  padding:24px 18px;
  position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:12px; padding:6px 6px 26px;}
.brand-mark{
  width:42px; height:42px; border-radius:11px;
  background:#ffffff;
  display:flex; align-items:center; justify-content:center;
  box-shadow: var(--shadow-2);
  flex-shrink:0; padding:5px; overflow:hidden;
}
.brand-mark svg{width:24px; height:24px;}
.brand-mark img{width:100%; height:100%; object-fit:contain;}
.brand-text{line-height:1.25;}
.brand-text b{font-family:var(--font-head); font-size:16px; font-weight:800; display:block; color:#fff;}
.brand-text span{font-size:11px; color:rgba(255,255,255,.5); letter-spacing:.02em;}

.nav{display:flex; flex-direction:column; gap:4px; margin-top:8px;}
.nav-item{
  display:flex; align-items:center; gap:12px;
  padding:12px 14px; border-radius:12px;
  color:rgba(255,255,255,.62); font-size:14.5px; font-weight:500;
  transition: background .18s var(--ease), color .18s var(--ease);
  border:none; background:none; width:100%; text-align:right;
}
.nav-item svg{width:19px; height:19px; flex-shrink:0; opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:var(--orange-500); color:#fff; box-shadow: 0 8px 20px -6px rgba(238,122,31,.55);}

.sidebar-foot{margin-top:auto; padding-top:18px; border-top:1px solid rgba(255,255,255,.08);}
.sidebar-foot p{font-size:11px; color:rgba(255,255,255,.32); line-height:1.7;}
.secret-dot{
  width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.15);
  margin-top:12px; border:none; transition:background .2s;
}
.secret-dot:hover{background:rgba(255,255,255,.35);}

.main{flex:1; min-width:0; padding:30px 38px 80px; max-width:1180px;}
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; gap:16px;}
.topbar h1{font-family:var(--font-head); font-size:26px; font-weight:800; color:var(--ink-900);}
.topbar p{color:var(--ink-500); font-size:13.5px; margin-top:4px;}
.clock{font-size:13px; color:var(--ink-500); text-align:left;}
.clock b{display:block; color:var(--ink-800); font-size:16px; font-family:var(--font-head);}

/* mobile top nav */
.mobile-topnav{display:none;}

/* ============ VIEW TRANSITIONS ============ */
.view{animation: viewIn .42s var(--ease);}
@keyframes viewIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

/* ============ HERO / SKYLINE ============ */
.hero{
  position:relative; overflow:hidden;
  background: linear-gradient(135deg, var(--ink-900), #24323f 70%);
  border-radius: var(--r-lg);
  padding: 34px 34px 0;
  margin-bottom:26px;
  color:#fff;
}
.hero-inner{position:relative; z-index:2; padding-bottom:26px; max-width:520px;}
.hero-eyebrow{font-size:12.5px; color:var(--orange-400); font-weight:700; margin-bottom:10px;}
.hero h2{font-family:var(--font-head); font-size:28px; font-weight:800; line-height:1.4; margin-bottom:10px;}
.hero p{color:rgba(255,255,255,.6); font-size:14px; line-height:1.8; margin-bottom:18px;}
.hero-stat{display:inline-flex; align-items:baseline; gap:8px;}
.hero-stat b{font-family:var(--font-head); font-size:38px; font-weight:800; color:var(--orange-400);}
.hero-stat span{font-size:13px; color:rgba(255,255,255,.55);}
.skyline{position:absolute; inset-inline-end:0; bottom:0; height:100%; display:flex; align-items:flex-end; gap:6px; padding-inline-end:20px; z-index:1; opacity:.9;}
.skyline .bld{background:linear-gradient(180deg, rgba(245,137,31,.28), rgba(245,137,31,.05)); border:1px solid rgba(245,137,31,.35); border-top:2px solid var(--orange-500); border-radius:3px 3px 0 0; opacity:0; animation: rise .7s var(--ease) forwards;}
@keyframes rise{ from{opacity:0; transform:translateY(24px);} to{opacity:1; transform:translateY(0);} }
.bld i{display:block; width:5px; height:5px; background:var(--orange-400); margin:5px; border-radius:1px; opacity:0; animation: glow 2.6s ease-in-out infinite;}
@keyframes glow{ 0%,100%{opacity:.25;} 50%{opacity:.95;} }

/* ============ STAT GRID ============ */
.grid-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:26px;}
.stat-card{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md);
  padding:20px; box-shadow:var(--shadow-1);
  transition: transform .25s var(--ease), box-shadow .25s var(--ease);
}
.stat-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-2);}
.stat-icon{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; margin-bottom:14px;}
.stat-icon svg{width:19px; height:19px;}
.stat-card .num{font-family:var(--font-head); font-size:26px; font-weight:800; color:var(--ink-900);}
.stat-card .lbl{font-size:12.5px; color:var(--ink-500); margin-top:3px;}

/* ============ PANELS / CARDS ============ */
.panel{background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--shadow-1); padding:22px;}
.panel + .panel{margin-top:18px;}
.panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.panel-head h3{font-family:var(--font-head); font-size:16px; font-weight:800; color:var(--ink-900);}
.panel-head span{font-size:12px; color:var(--ink-500);}

.two-col{display:grid; grid-template-columns: 1.3fr 1fr; gap:18px;}

/* bar chart */
.bars{display:flex; align-items:flex-end; gap:10px; height:140px; padding-top:10px;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:8px;}
.bar-col .bar{width:100%; max-width:30px; border-radius:6px 6px 3px 3px; background:linear-gradient(180deg,var(--orange-500),var(--orange-700)); height:2px; transition: height .8s var(--ease);}
.bar-col .bar-lbl{font-size:11px; color:var(--ink-500);}

.proj-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line);}
.proj-row:last-child{border-bottom:none;}
.proj-row .dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
.proj-row .name{flex:1; font-size:13.5px; font-weight:500; color:var(--ink-800);}
.proj-row .track{width:110px; height:6px; background:var(--ink-100); border-radius:6px; overflow:hidden;}
.proj-row .fill{height:100%; background:var(--orange-500); border-radius:6px; transition:width .8s var(--ease);}
.proj-row .cnt{font-size:12px; color:var(--ink-500); width:20px; text-align:left;}

/* upcoming list */
.up-item{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);}
.up-item:last-child{border-bottom:none;}
.up-avatar{width:38px; height:38px; border-radius:10px; background:var(--orange-100); color:var(--orange-700); display:flex; align-items:center; justify-content:center; font-weight:800; font-family:var(--font-head); flex-shrink:0; font-size:14px;}
.up-info{flex:1; min-width:0;}
.up-info .n{font-size:13.5px; font-weight:600; color:var(--ink-800); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.up-info .p{font-size:12px; color:var(--ink-500);}
.up-time{font-size:12px; color:var(--orange-700); font-weight:700; background:var(--orange-50); padding:5px 10px; border-radius:8px; white-space:nowrap;}
.empty-note{color:var(--ink-300); font-size:13px; text-align:center; padding:30px 10px;}

/* ============ PROJECTS GRID ============ */
.projects-toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:12px;}
.search-box{position:relative; max-width:280px; flex:1;}
.search-box input{width:100%; padding:10px 14px 10px 14px; border:1px solid var(--line); border-radius:10px; background:var(--paper); font-size:13.5px; color:var(--ink-800);}
.search-box input:focus{border-color:var(--orange-500);}

.grid-projects{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:18px;}
.pcard{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md);
  overflow:hidden; box-shadow:var(--shadow-1); cursor:pointer;
  transform-style:preserve-3d; will-change:transform;
  transition: box-shadow .3s var(--ease), transform .12s linear;
}
.pcard:hover{box-shadow:var(--shadow-3);}
.pcard-art{height:130px; position:relative; overflow:hidden; display:flex; align-items:flex-end; justify-content:center;}
.pcard-art svg{transform: translateZ(20px); filter:drop-shadow(0 14px 16px rgba(0,0,0,.18));}
.pcard-body{padding:16px 16px 18px;}
.pcard-body h4{font-family:var(--font-head); font-size:15.5px; font-weight:800; color:var(--ink-900); margin-bottom:4px;}
.pcard-body .loc{font-size:12px; color:var(--ink-500); display:flex; align-items:center; gap:5px; margin-bottom:12px;}
.pcard-body .loc svg{width:12px; height:12px; opacity:.7;}
.pcard-meta{display:flex; align-items:center; justify-content:space-between;}
.chip{font-size:11px; font-weight:700; padding:5px 10px; border-radius:20px; display:inline-flex; align-items:center; gap:5px;}
.chip svg{width:11px; height:11px;}
.chip.units{background:#eef1fb; color:#4a5bc7;}
.chip.loc{background:#e6f4f7; color:#1479a8;}
.chip.visits{background:var(--orange-100); color:var(--orange-700);}
.chip.attend{background:#e2f4e7; color:#237a45;}
.add-card{
  border:2px dashed var(--line); border-radius:var(--r-md); min-height:230px;
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
  color:var(--ink-300); font-size:13px; font-weight:600;
  transition:border-color .2s, color .2s;
}
.add-card:hover{border-color:var(--orange-400); color:var(--orange-600);}
.add-card svg{width:26px; height:26px;}

/* ============ PROJECT DETAIL ============ */
.back-link{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-500); margin-bottom:16px; font-weight:600;}
.back-link:hover{color:var(--orange-600);}
.back-link svg{width:15px; height:15px;}

.pd-header{display:flex; gap:22px; align-items:center; background:var(--paper); border:1px solid var(--line); border-radius:var(--r-lg); padding:24px; margin-bottom:22px; box-shadow:var(--shadow-1);}
.pd-art{width:100px; height:100px; flex-shrink:0; border-radius:18px; display:flex; align-items:center; justify-content:center;}
.pd-art svg{width:58px; height:58px;}
.pd-info h2{font-family:var(--font-head); font-size:22px; font-weight:800; color:var(--ink-900); margin-bottom:6px;}
.pd-info p{font-size:13px; color:var(--ink-500); margin-bottom:10px; max-width:520px; line-height:1.7;}
.pd-tags{display:flex; gap:8px; flex-wrap:wrap;}

.cal-wrap{display:grid; grid-template-columns:1.5fr 1fr; gap:18px; align-items:start;}
.cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.cal-nav h3{font-family:var(--font-head); font-size:16px; font-weight:800;}
.cal-nav-btns{display:flex; align-items:center; gap:6px;}
.icon-btn{width:30px; height:30px; border-radius:9px; border:1px solid var(--line); background:var(--paper); display:flex; align-items:center; justify-content:center; color:var(--ink-700); transition:background .18s; flex-shrink:0;}
.icon-btn:hover{background:var(--orange-50); color:var(--orange-700); border-color:var(--orange-100);}
.icon-btn svg{width:14px; height:14px;}
.cal-shell{max-width:320px; margin:0 auto;}
.weekdays{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:10.5px; color:var(--ink-300); font-weight:800; margin-bottom:6px;}
.days{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; justify-items:center;}
.day-cell{width:100%; max-width:38px; aspect-ratio:1; border-radius:9px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11.5px; color:var(--ink-700); position:relative; border:1px solid transparent; transition:background .15s, border-color .15s, transform .12s;}
.day-cell.pad{visibility:hidden;}
.day-cell:not(.pad):hover{background:var(--orange-50); cursor:pointer; transform:translateY(-1px);}
.day-cell.today{border-color:var(--orange-400); font-weight:800; color:var(--orange-700);}
.day-cell.selected{background:var(--orange-500); color:#fff; font-weight:800;}
.day-cell .cnt2{position:absolute; top:1px; left:3px; font-size:7px; color:var(--orange-600); font-weight:800; line-height:1;}
.day-cell.selected .cnt2{color:#ffe4c6;}
.cal-legend{display:flex; align-items:center; justify-content:center; gap:6px; margin-top:12px; font-size:10.5px; color:var(--ink-300);}
.cal-legend .sw{width:13px; height:13px; border-radius:4px;}

.day-panel h4{font-family:var(--font-head); font-size:14.5px; font-weight:800; margin-bottom:12px; color:var(--ink-900);}
.appt{background:var(--canvas); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px;}
.appt-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
.appt-top .nm{font-size:13.5px; font-weight:700; color:var(--ink-800);}
.appt-top .tm{font-size:12px; font-weight:800; color:var(--orange-700); background:var(--orange-100); padding:3px 9px; border-radius:8px;}
.appt .ph{font-size:12px; color:var(--ink-500); direction:ltr; text-align:right;}
.appt .note{font-size:11.5px; color:var(--ink-300); margin-top:4px;}

/* ============ BUTTONS ============ */
.btn{display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border-radius:11px; font-size:13.5px; font-weight:700; border:none; transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .15s;}
.btn svg{width:15px; height:15px;}
.btn-primary{background:var(--orange-500); color:#fff; box-shadow:0 10px 22px -8px rgba(238,122,31,.55);}
.btn-primary:hover{background:var(--orange-600); transform:translateY(-1px);}
.btn-ghost{background:var(--paper); color:var(--ink-700); border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--ink-300);}
.btn-danger{background:#fdeceb; color:#c8341f;}
.btn-danger:hover{background:#fadbd8;}
.btn-sm{padding:7px 12px; font-size:12.5px;}
.btn-block{width:100%; justify-content:center;}

/* ============ FORMS ============ */
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-700); margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%; padding:10px 13px; border:1px solid var(--line); border-radius:10px;
  background:var(--canvas); font-size:13.5px; color:var(--ink-800);
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--orange-500); background:var(--paper);}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

/* ============ MODAL ============ */
.modal-overlay{position:fixed; inset:0; background:rgba(15,20,25,.55); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; opacity:0; animation:fadeIn .2s forwards;}
@keyframes fadeIn{to{opacity:1;}}
.modal{background:var(--paper); border-radius:var(--r-lg); padding:26px; width:100%; max-width:440px; box-shadow:var(--shadow-3); transform:translateY(14px) scale(.97); opacity:0; animation:modalIn .32s var(--ease) forwards .05s; max-height:88vh; overflow-y:auto;}
@keyframes modalIn{to{transform:translateY(0) scale(1); opacity:1;}}
.modal.wide{max-width:640px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.modal-head h3{font-family:var(--font-head); font-size:17px; font-weight:800;}
.modal-close{width:30px; height:30px; border-radius:9px; border:none; background:var(--canvas); display:flex; align-items:center; justify-content:center; color:var(--ink-500);}
.modal-close:hover{background:var(--ink-100);}
.modal-close svg{width:14px; height:14px;}
.modal-actions{display:flex; gap:10px; margin-top:18px;}
.modal-actions .btn{flex:1;}

/* toast */
.toast{position:fixed; bottom:26px; right:50%; transform:translateX(50%) translateY(20px); background:var(--ink-900); color:#fff; padding:13px 22px; border-radius:12px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow-3); z-index:200; opacity:0; transition:transform .3s var(--ease), opacity .3s; display:flex; align-items:center; gap:8px; max-width:min(90vw,520px); text-align:right;}
.toast.show{opacity:1; transform:translateX(50%) translateY(0);}
.toast svg{width:16px; height:16px; color:var(--orange-400); flex-shrink:0;}

/* ============ ADMIN ============ */
.admin-lock{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--ink-900); padding:20px;}
.lock-box{background:var(--paper); border-radius:var(--r-lg); padding:34px; width:100%; max-width:360px; box-shadow:var(--shadow-3); text-align:center;}
.lock-box .brand-mark{margin:0 auto 16px;}
.lock-box h3{font-family:var(--font-head); font-size:18px; font-weight:800; margin-bottom:6px; color:var(--ink-900);}
.lock-box p{font-size:12.5px; color:var(--ink-500); margin-bottom:20px;}
.lock-box input{text-align:center; letter-spacing:.15em; font-size:16px; font-weight:700;}
.lock-err{color:#c8341f; font-size:12px; margin-top:10px; min-height:16px; font-weight:600;}

.admin-tabs{display:flex; gap:6px; margin-bottom:20px; border-bottom:1px solid var(--line); padding-bottom:0;}
.a-tab{padding:11px 16px; font-size:13.5px; font-weight:700; color:var(--ink-500); border-bottom:2px solid transparent; background:none; border-top:none; border-inline:none;}
.a-tab.active{color:var(--orange-600); border-bottom-color:var(--orange-500);}

.table{width:100%; border-collapse:collapse; font-size:13px;}
.table th{text-align:right; padding:10px 12px; color:var(--ink-500); font-size:11.5px; font-weight:700; border-bottom:1px solid var(--line);}
.table td{padding:11px 12px; border-bottom:1px solid var(--line); color:var(--ink-800);}
.table tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}
.mini-btn{width:28px; height:28px; border-radius:8px; border:none; background:var(--canvas); display:inline-flex; align-items:center; justify-content:center; color:var(--ink-500); margin-inline-start:4px;}
.mini-btn:hover{background:var(--ink-100); color:var(--ink-800);}
.mini-btn.danger:hover{background:#fdeceb; color:#c8341f;}
.mini-btn svg{width:13px; height:13px;}

.dropzone{border:2px dashed var(--line); border-radius:var(--r-md); padding:34px 20px; text-align:center; transition:border-color .2s, background .2s; cursor:pointer;}
.dropzone.drag{border-color:var(--orange-500); background:var(--orange-50);}
.dropzone svg{width:30px; height:30px; color:var(--orange-500); margin-bottom:10px;}
.dropzone b{display:block; font-size:14px; color:var(--ink-800); margin-bottom:4px;}
.dropzone span{font-size:12px; color:var(--ink-500);}

.status-badge{font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; display:inline-block;}
.status-badge.scheduled{background:var(--orange-100); color:var(--orange-700);}
.status-badge.done{background:#e2f4e7; color:#237a45;}
.status-badge.cancelled{background:var(--ink-100); color:var(--ink-500);}

/* ============ RESPONSIVE ============ */
@media (max-width: 900px){
  .sidebar{display:none;}
  .mobile-topnav{
    display:flex; position:sticky; top:0; z-index:50; background:var(--paper);
    border-bottom:1px solid var(--line); padding:14px 18px; align-items:center; justify-content:space-between;
  }
  .mobile-topnav .brand{padding:0;}
  .mobile-topnav .nav{flex-direction:row; margin:0; gap:6px;}
  .mobile-topnav .nav-item{padding:8px 12px; font-size:12.5px;}
  .mobile-topnav .nav-item span{display:none;}
  .main{padding:20px 16px 70px; max-width:100%;}
  .grid-stats{grid-template-columns:repeat(2,1fr);}
  .two-col{grid-template-columns:1fr;}
  .cal-wrap{grid-template-columns:1fr;}
  .hero{padding:24px 20px 0;}
  .skyline{display:none;}
  .pd-header{flex-direction:column; text-align:center;}
  .field-row{grid-template-columns:1fr;}
}
@media (max-width:520px){
  .grid-stats{grid-template-columns:1fr 1fr;}
  .grid-projects{grid-template-columns:1fr 1fr;}
}
</style>

function hashStr(s){
  let h=0; for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i))|0; }
  return Math.abs(h);
}
let svgCallCounter = 0;
function buildingSVG(seed, size=54){
  svgCallCounter++;
  const uid2 = 'bsvg'+svgCallCounter;
  const h1 = 26 + (seed%6)*6;       // 26-56
  const h2 = 16 + ((seed>>3)%6)*5;  // 16-41
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" fill="none" style="filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))">
    <defs>
      <linearGradient id="${uid2}-l" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".98"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity=".72"/>
      </linearGradient>
      <linearGradient id="${uid2}-m" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".62"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity=".28"/>
      </linearGradient>
      <linearGradient id="${uid2}-t" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity=".85"/>
      </linearGradient>
    </defs>
    <ellipse cx="29" cy="56" rx="21" ry="4.5" fill="rgba(0,0,0,.22)"/>
    <path d="M14 54 L14 ${54-h1} L28 ${46-h1} L28 54 Z" fill="url(#${uid2}-l)"/>
    <path d="M28 54 L28 ${46-h1} L44 ${54-h1-h2+22} L44 54 Z" fill="url(#${uid2}-m)"/>
    <path d="M14 ${54-h1} L28 ${46-h1} L44 ${54-h1-h2+22-8} L30 ${38-h1}Z" fill="url(#${uid2}-t)"/>
    ${Array.from({length:3}).map((_,r)=>`<rect x="17" y="${54-h1+8+r*9}" width="4" height="5" rx="1" fill="rgba(255,255,255,.9)"/>`).join('')}
    ${Array.from({length:3}).map((_,r)=>`<rect x="33" y="${54-h1-h2+30+r*8}" width="4" height="5" rx="1" fill="rgba(20,29,39,.32)"/>`).join('')}
  </svg>`;
}

const State = {
  route: "home",
  projects: [],
  viewings: [],
  ready: false,
  db: null,
  selectedProjectId: null,
  calYear: new Date().getFullYear(),
  calMonth: new Date().getMonth(),
  selectedDay: null,
  homeCalYear: new Date().getFullYear(),
  homeCalMonth: new Date().getMonth(),
  adminAuthed: sessionStorage.getItem('dar_admin_ok') === '1',
  adminTab: 'projects',
  useLocal: false,
};

const LS_KEY_P = 'dar_projects_v1';
const LS_KEY_V = 'dar_viewings_v1';

function uid(){ return 'id-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function localLoad(){
  try{ State.projects = JSON.parse(localStorage.getItem(LS_KEY_P) || '[]'); }catch(e){ State.projects = []; }
  try{ State.viewings = JSON.parse(localStorage.getItem(LS_KEY_V) || '[]'); }catch(e){ State.viewings = []; }
}
function localSaveP(){ localStorage.setItem(LS_KEY_P, JSON.stringify(State.projects)); }
function localSaveV(){ localStorage.setItem(LS_KEY_V, JSON.stringify(State.viewings)); }

async function initStore(){
  try{
    if(window.claude && window.claude.use){
      const db = await window.claude.use('db');
      if(db){
        State.db = db;
        State.useLocal = false;
        db.collection('projects').onSnapshot(snap=>{
          State.projects = snap.docs.map(d=>({id:d.id, ...d.data()}));
          State.ready = true;
          maybeSeedSarayaAlbaher();
          render();
        }, ()=>{ fallbackLocal(); });
        db.collection('viewings').onSnapshot(snap=>{
          State.viewings = snap.docs.map(d=>({id:d.id, ...d.data()}));
          render();
        }, ()=>{});
        return;
      }
    }
  }catch(e){ /* fall through */ }
  fallbackLocal();
}
function fallbackLocal(){
  State.useLocal = true;
  State.db = null;
  localLoad();
  State.ready = true;
  seedIfEmpty();
  maybeSeedSarayaAlbaher();
  render();
}
function seedIfEmpty(){
  if(State.useLocal && State.projects.length===0){
    // no auto demo data injected — keep empty, admin adds real projects
  }
}

let seedChecked = false;
async function maybeSeedSarayaAlbaher(){
  if(seedChecked) return;
  seedChecked = true;
  const exists = State.projects.some(p=> (p.name||'').trim() === SEED_PROJECT_NAME);
  if(exists) return;
  try{
    let projectId;
    const projData = { name: SEED_PROJECT_NAME, city:'الدمام', units: 0, description:'مشروع سرايا البحر السكني' };
    if(State.db){
      const ref = await State.db.collection('projects').add({...projData, createdAt:new Date().toISOString()});
      projectId = ref.id;
    } else {
      projectId = uid();
      State.projects.push({id:projectId, ...projData, createdAt:new Date().toISOString()});
      localSaveP();
    }
    const rows = SEED_APPOINTMENTS.map(r=>({...r, projectId}));
    await bulkAddViewings(rows);
    toast('تمت إضافة بيانات معاينات سرايا البحر');
  }catch(e){ /* ignore seeding errors */ }
}

async function addProject(data){
  if(State.db){ await State.db.collection('projects').add({...data, createdAt: new Date().toISOString()}); }
  else{ State.projects.push({id:uid(), ...data, createdAt:new Date().toISOString()}); localSaveP(); render(); }
}
async function updateProject(id, data){
  if(State.db){ await State.db.doc('projects/'+id).update(data); }
  else{ const p=State.projects.find(x=>x.id===id); if(p) Object.assign(p,data); localSaveP(); render(); }
}
async function deleteProject(id){
  if(State.db){
    await State.db.doc('projects/'+id).delete();
    const vs = State.viewings.filter(v=>v.projectId===id);
    for(const v of vs){ await State.db.doc('viewings/'+v.id).delete(); }
  } else {
    State.projects = State.projects.filter(p=>p.id!==id);
    State.viewings = State.viewings.filter(v=>v.projectId!==id);
    localSaveP(); localSaveV(); render();
  }
}
async function addViewing(data){
  if(State.db){ await State.db.collection('viewings').add({...data, createdAt:new Date().toISOString()}); }
  else{ State.viewings.push({id:uid(), ...data, createdAt:new Date().toISOString()}); localSaveV(); render(); }
}
async function updateViewing(id, data){
  if(State.db){ await State.db.doc('viewings/'+id).update(data); }
  else{ const v=State.viewings.find(x=>x.id===id); if(v) Object.assign(v,data); localSaveV(); render(); }
}
async function deleteViewing(id){
  if(State.db){ await State.db.doc('viewings/'+id).delete(); }
  else{ State.viewings = State.viewings.filter(v=>v.id!==id); localSaveV(); render(); }
}
async function bulkAddViewings(rows){
  if(State.db){
    for(const r of rows){ await State.db.collection('viewings').add({...r, createdAt:new Date().toISOString()}); }
  } else {
    rows.forEach(r=> State.viewings.push({id:uid(), ...r, createdAt:new Date().toISOString()}));
    localSaveV(); render();
  }
}

/* ================= HELPERS ================= */
const WEEKDAYS = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const WEEKDAYS_LETTER = ['ح','ن','ث','ر','خ','ج','س'];
const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDateHuman(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  return `${d} ${MONTHS[m-1]} ${y}`;
}
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, isErr){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = `${ICON.check}<span>${escapeHtml(msg)}</span>`;
  if(isErr) el.style.background = '#c8341f';
  root.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  const duration = isErr? Math.min(9000, 2600 + msg.length*35) : 2600;
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),300); }, duration);
}
function projectById(id){ return State.projects.find(p=>p.id===id); }
function viewingsForProject(id){ return State.viewings.filter(v=>v.projectId===id); }
function viewingsOnDate(iso, projectId){
  return State.viewings.filter(v=> v.date===iso && (!projectId || v.projectId===projectId));
}
function heatBg(count, max){
  if(!count) return '';
  const ratio = Math.min(1, count/Math.max(1,max));
  const alpha = (0.16 + ratio*0.68).toFixed(2);
  return `background:rgba(245,137,31,${alpha});`;
}
function heatTextColor(count, max){
  if(!count) return '';
  const ratio = Math.min(1, count/Math.max(1,max));
  return ratio > 0.55 ? 'color:#fff;' : '';
}
function buildCalendarCells(year, month, countFn){
  const firstDay = new Date(year,month,1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  const isos = cells.filter(d=>d!==null).map(d=>`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  const max = Math.max(1, ...isos.map(iso=>countFn(iso)));
  return { cells, max, year, month };
}
function animateCount(el, to){
  let cur = 0; const dur = 700; const start = performance.now();
  function step(t){
    const p = Math.min(1,(t-start)/dur);
    const eased = 1-Math.pow(1-p,3);
    el.textContent = Math.round(eased*to);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* 3D tilt */
function attachTilt(el){
  el.addEventListener('mousemove', e=>{
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left)/r.width - .5;
    const py = (e.clientY - r.top)/r.height - .5;
    el.style.transform = `perspective(700px) rotateX(${(-py*8).toFixed(2)}deg) rotateY(${(px*10).toFixed(2)}deg) translateY(-4px)`;
  });
  el.addEventListener('mouseleave', ()=>{ el.style.transform = ''; });
}

/* ================= ROUTER ================= */
window.addEventListener('hashchange', handleHash);
function handleHash(){
  const h = location.hash.replace('#/','').replace('#','');
  if(h === 'admin'){ State.route='admin'; render(); return; }
  if(h.startsWith('project-')){ State.route='project'; State.selectedProjectId = h.replace('project-',''); State.selectedDay=null; render(); return; }
  if(h === 'projects'){ State.route='projects'; render(); return; }
  State.route = 'home';
  render();
}
function goto(route){ location.hash = route; }

      <div class="hero-inner">

        <h2>نظرة شاملة على معاينات<br>جميع مشاريع دار وإعمار</h2>
        <p>تحليلات لحظية لمواعيد المعاينة، وأداء كل مشروع، والحركة الأسبوعية للعملاء.</p>
        <div class="hero-stat"><b id="hs-today">0</b><span>معاينة اليوم</span></div>
      </div>
      <div class="skyline">
        ${Array.from({length:9}).map((_,i)=>{
          const h = [40,65,50,80,55,95,45,70,58][i];
          const w = 26;
          const delay = (i*0.06).toFixed(2);
          return `<div class="bld" style="height:${h}%;width:${w}px;animation-delay:${delay}s">${i%2===0?'<i style="animation-delay:'+(i*0.3)+'s"></i>':''}</div>`;

    </div>

    <div class="panel" style="margin-bottom:26px;">
      <div class="cal-nav">

          <button class="icon-btn" onclick="shiftHomeMonth(1)">${ICON.chevL}</button>
        </div>
      </div>
      <div class="cal-shell">
        <div class="weekdays">${WEEKDAYS_LETTER.map(w=>`<div>${w}</div>`).join('')}</div>
        ${(()=>{
          const {cells, max} = buildCalendarCells(State.homeCalYear, State.homeCalMonth, iso=>viewingsOnDate(iso).length);
          const todayStr = todayISO();
          return `<div class="days">${cells.map(d=>{
            if(d===null) return `<div class="day-cell pad"></div>`;
            const iso = `${State.homeCalYear}-${String(State.homeCalMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const count = viewingsOnDate(iso).length;
            const isToday = iso===todayStr;
            return `<div class="day-cell ${isToday?'today':''}" style="${heatBg(count,max)}${heatTextColor(count,max)}cursor:pointer" onclick="openDayLookup('${iso}')">
              ${count>0?`<span class="cnt2" style="${heatTextColor(count,max)}">${count}</span>`:''}

          }).join('')}</div>`;

              <div class="track"><div class="fill" data-w="${(c/maxProj)*100}"></div></div>
              <div class="cnt">${c}</div>
            </div>`).join('') : `<div class="empty-note">لا توجد مشاريع بعد</div>`}
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>المعاينات القادمة</h3><span>${upcoming.length}</span></div>
        ${upcoming.length? upcoming.map(v=>{
          const p = projectById(v.projectId);
          return `<div class="up-item" style="cursor:pointer" onclick="openAppointmentDetail('${v.id}')">
            <div class="up-avatar">${escapeHtml((v.name||'?').trim().charAt(0))}</div>
            <div class="up-info"><div class="n">${escapeHtml(v.name)}</div><div class="p">${escapeHtml(p?p.name:'')} · ${fmtDateHuman(v.date)}</div></div>

  animateCount(document.getElementById('hs-today'), todays.length);

    document.querySelectorAll('.fill').forEach(f=> f.style.width = f.dataset.w+'%');

/* ================= RENDER: PROJECT DETAIL ================= */
function renderProjectDetail(){
  const p = projectById(State.selectedProjectId);
  if(!p){ renderProjects(); return; }
  const seed = hashStr(p.id||p.name);
  const style = PROJECT_STYLES[seed%PROJECT_STYLES.length];
  const vs = viewingsForProject(p.id);

  const y = State.calYear, m = State.calMonth;
  const todayStr = todayISO();
  const { cells, max } = buildCalendarCells(y, m, iso=>viewingsOnDate(iso, p.id).length);

  const dayCellsHTML = cells.map(d=>{
    if(d===null) return `<div class="day-cell pad"></div>`;
    const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const count = viewingsOnDate(iso, p.id).length;
    const isToday = iso===todayStr;
    const isSel = iso===State.selectedDay;
    return `<div class="day-cell ${isToday?'today':''} ${isSel?'selected':''}" style="${isSel?'':heatBg(count,max)+heatTextColor(count,max)}" onclick="selectDay('${iso}')">
      ${count>0?`<span class="cnt2" style="${isSel?'':heatTextColor(count,max)}">${count}</span>`:''}
      <span>${d}</span>
    </div>`;
  }).join('');

  const dayList = State.selectedDay ? viewingsOnDate(State.selectedDay, p.id).sort((a,b)=>(a.time||'').localeCompare(b.time||'')) : [];

  const html = `
    <a class="back-link" onclick="goto('projects')">${ICON.arrow}<span>رجوع للمشاريع</span></a>
    <div class="pd-header">
      <div class="pd-art" style="background:${style.bg}">${buildingSVG(seed,52)}</div>
      <div class="pd-info">
        <h2>${escapeHtml(p.name)}</h2>
        <p>${escapeHtml(p.description||'لا يوجد وصف لهذا المشروع بعد.')}</p>
        <div class="pd-tags">
          <span class="chip loc">${ICON.pin} ${escapeHtml(p.city||'—')}</span>
          <span class="chip units">${ICON.bldg} ${p.units||0} وحدة</span>
          <span class="chip visits">${ICON.calendar} ${vs.length} معاينة مسجلة</span>
          ${(()=>{
            const known = vs.filter(v=>typeof v.attended==='boolean');
            if(!known.length) return '';
            const rate = Math.round(known.filter(v=>v.attended).length/known.length*100);
            return `<span class="chip attend">${ICON.check} ${rate}% نسبة الحضور</span>`;
          })()}
        </div>
      </div>
    </div>

    <div class="cal-wrap">
      <div class="panel">
        <div class="cal-nav">
          <h3>${MONTHS[m]} ${y}</h3>
          <div class="cal-nav-btns">
            <button class="icon-btn" onclick="shiftMonth(-1)">${ICON.chevR}</button>
            <button class="icon-btn" onclick="shiftMonth(1)">${ICON.chevL}</button>
          </div>
        </div>
        <div class="cal-shell">
          <div class="weekdays">${WEEKDAYS_LETTER.map(w=>`<div>${w}</div>`).join('')}</div>
          <div class="days">${dayCellsHTML}</div>
          <div class="cal-legend"><span>أقل</span><span class="sw" style="background:rgba(245,137,31,.15)"></span><span class="sw" style="background:rgba(245,137,31,.4)"></span><span class="sw" style="background:rgba(245,137,31,.65)"></span><span class="sw" style="background:rgba(245,137,31,.9)"></span><span>أكثر</span></div>
        </div>
      </div>
      <div class="panel day-panel">
        <h4>${State.selectedDay? 'معاينات '+fmtDateHuman(State.selectedDay) : 'اختر يومًا لعرض المعاينات'}</h4>
        ${State.selectedDay ? (dayList.length? dayList.map(v=>`
          <div class="appt" style="cursor:pointer" onclick="openAppointmentDetail('${v.id}')">
            <div class="appt-top"><span class="nm">${escapeHtml(v.name)}</span><span class="tm">${escapeHtml(v.time||'')}</span></div>
            ${v.phone?`<div class="ph">${ICON.phone.replace('width="24" height="24"','width="11" height="11" style="display:inline;vertical-align:-2px;margin-left:4px;"')} ${escapeHtml(v.phone)}</div>`:''}
            ${v.unit?`<div class="note">رقم الوحدة: ${escapeHtml(v.unit)}</div>`:''}
            ${v.notes?`<div class="note">${escapeHtml(v.notes)}</div>`:''}
          </div>`).join('') : `<div class="empty-note">لا توجد معاينات في هذا اليوم</div>`)
        : `<div class="empty-note">اضغط على أي يوم بالتقويم لعرض تفاصيل المعاينات المجدولة فيه</div>`}
      </div>
    </div>
  `;
  document.getElementById('app').innerHTML = shellHTML('project', html);
}
function shiftMonth(delta){
  let m = State.calMonth + delta, y = State.calYear;
  if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
  State.calMonth=m; State.calYear=y; render();
}
function shiftHomeMonth(delta){
  let m = State.homeCalMonth + delta, y = State.homeCalYear;
  if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
  State.homeCalMonth=m; State.homeCalYear=y; render();
}
function jumpHomeToday(){
  const now = new Date();
  State.homeCalMonth = now.getMonth(); State.homeCalYear = now.getFullYear();
  render();
  openDayLookup(todayISO());
}
function selectDay(iso){ State.selectedDay = (State.selectedDay===iso)? null : iso; render(); }

/* ================= PROJECT FORM MODAL ================= */
function openProjectForm(id){
  const p = id? projectById(id) : null;
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <div class="modal-head"><h3>${p?'تعديل المشروع':'مشروع جديد'}</h3><button class="modal-close" onclick="closeModal()">${ICON.x}</button></div>
        <form id="pform">
          <div class="field"><label>اسم المشروع</label><input required name="name" value="${p?escapeHtml(p.name):''}" placeholder="مثال: أبراج الواحة"></div>
          <div class="field"><label>المدينة / الموقع</label><input name="city" value="${p?escapeHtml(p.city||''):''}" placeholder="الرياض"></div>
          <div class="field field-row">
            <div><label>عدد الوحدات</label><input type="number" min="0" name="units" value="${p?p.units||'':''}" placeholder="120"></div>
          </div>
          <div class="field"><label>وصف مختصر</label><textarea name="description" rows="3" placeholder="نبذة عن المشروع…">${p?escapeHtml(p.description||''):''}</textarea></div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
            <button type="submit" class="btn btn-primary">${ICON.check}<span>${p?'حفظ التعديلات':'إضافة المشروع'}</span></button>
          </div>
        </form>
      </div>
    </div>`;
  document.getElementById('pform').onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const data = { name:f.get('name').trim(), city:f.get('city').trim(), units: Number(f.get('units'))||0, description: f.get('description').trim() };
    if(!data.name) return;
    if(p) await updateProject(p.id, data); else await addProject(data);
    closeModal();
    toast(p?'تم حفظ التعديلات':'تمت إضافة المشروع');
    if(State.useLocal) render();
  };
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

  const v = State.viewings.find(x=>x.id===id);
  if(!v) return;
  const p = projectById(v.projectId);
  const root = document.getElementById('modal-root');

function adminImportHTML(){

function setupDropzone(){
  const dz = document.getElementById('dropzone');

  if(!dz) return;

  dz.ondragover = (e)=>{ e.preventDefault(); dz.classList.add('drag'); };
  dz.ondragleave = ()=> dz.classList.remove('drag');

}
function normalizeHeader(h){
  h = String(h||'').trim().toLowerCase();
  const map = {
    'الاسم':'name','اسم العميل':'name','الاسم الكامل':'name','name':'name','اسم':'name',
    'account name':'name','customer name':'name','client name':'name','full name':'name','اسم الحساب':'name',
    'الجوال':'phone','رقم الجوال':'phone','الهاتف':'phone','phone':'phone','جوال':'phone',
    'mobile':'phone','mobile number':'phone','account mobile number':'phone','رقم الهاتف':'phone',
    'التاريخ':'date','date':'date','تاريخ':'date','تاريخ المعاينة':'date','appointment date':'date',
    'الوقت':'time','time':'time','وقت':'time','وقت المعاينة':'time',
    'المشروع':'project','project':'project','اسم المشروع':'project',
    'رقم الوحدة':'unit','الوحدة':'unit','unit':'unit','unit: unit name':'unit','unit name':'unit',
    'رقم الهوية':'nationalId','الهوية':'nationalId','national id':'nationalId','customer national id':'nationalId',
    'رقم الموعد':'appointmentNumber','appointmentnumber':'appointmentNumber','appointment number':'appointmentNumber',
    'active appointment: appointment number':'appointmentNumber',
    'الحضور':'attended','attended':'attended','attended appointment':'attended','حالة الحضور':'attended',
    'ملاحظات':'notes','notes':'notes',
  };
  return map[h] || null;
}
function parseAttended(val){
  if(val===undefined || val==='' || val===null) return undefined;
  if(typeof val === 'boolean') return val;
  const s = String(val).trim().toLowerCase();
  if(['true','1','yes','y','نعم','حضر','تم الحضور'].includes(s)) return true;
  if(['false','0','no','n','لا','لم يحضر'].includes(s)) return false;
  return undefined;
}
function excelDateToISO(val){
  if(val==null || val==='') return '';
  if(typeof val === 'number'){
    const d = XLSX.SSF.parse_date_code(val);
    if(d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
  }
  const s = String(val).trim();
  // try common formats
  let mth = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(mth) return `${mth[1]}-${mth[2].padStart(2,'0')}-${mth[3].padStart(2,'0')}`;
  mth = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
  if(mth) return `${mth[3]}-${mth[2].padStart(2,'0')}-${mth[1].padStart(2,'0')}`;
  return s;
}
function excelTimeToHHMM(val){
  if(val==null || val==='') return '';
  if(typeof val === 'number'){
    const totalMin = Math.round(val*24*60);
    const h = Math.floor(totalMin/60)%24, m = totalMin%60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  }
  const s = String(val).trim();
  const m = s.match(/(\d{1,2}):(\d{2})/);
  if(m) return `${m[1].padStart(2,'0')}:${m[2]}`;
  return s;
}
function handleFile(file){
  if(!file || file.size===0){
    toast('لا يمكن استيراد الملف — الملف فارغ، تأكد من اختيار ملف يحتوي على بيانات', true);
    return;
  }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'binary', cellDates:false});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      if(!sheet){
        toast('لا يمكن استيراد الملف — لا توجد أي بيانات داخل الملف', true);
        return;
      }
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
      if(rows.length === 0){
        toast('لا يمكن استيراد الملف — الملف فارغ', true);
        return;
      }
      if(rows.length < 2){
        toast('لا يمكن استيراد الملف — يحتوي على رؤوس الأعمدة فقط بدون بيانات', true);
        return;
      }
      const headers = rows[0].map(normalizeHeader);
      if(!headers.includes('name')){
        const rawHeaders = rows[0].map(h=>String(h||'').trim()).filter(Boolean).join('، ');
        toast('لا يمكن استيراد الملف — تعذّر التعرف على عمود الاسم. الأعمدة الموجودة في الملف: ' + (rawHeaders||'لا يوجد رؤوس أعمدة'), true);
        return;
      }
      const defaultProj = document.getElementById('import-default-project').value;
      importedRows = [];
      for(let i=1;i<rows.length;i++){
        const row = rows[i];
        if(row.every(c=>c==='' || c==null)) continue;
        const obj = {};
        headers.forEach((key,idx)=>{ if(key) obj[key] = row[idx]; });
        if(!obj.name) continue;
        let projectId = defaultProj;
        if(obj.project){
          const found = State.projects.find(p=> p.name.trim() === String(obj.project).trim());
          if(found) projectId = found.id;
        }
        let rawDate = obj.date, rawTime = obj.time;
        if(rawDate && !rawTime && typeof rawDate === 'string' && rawDate.includes(',')){
          const parts = rawDate.split(',');
          rawDate = parts[0].trim();
          rawTime = parts.slice(1).join(',').trim();
        }
        const attended = parseAttended(obj.attended);
        importedRows.push({
          name: String(obj.name).trim(),
          phone: obj.phone!=null? String(obj.phone).trim(): '',
          date: excelDateToISO(rawDate),
          time: excelTimeToHHMM(rawTime),
          unit: obj.unit!=null? String(obj.unit).trim(): '',
          nationalId: obj.nationalId!=null? String(obj.nationalId).trim(): '',
          appointmentNumber: obj.appointmentNumber!=null? String(obj.appointmentNumber).trim(): '',
          notes: obj.notes!=null? String(obj.notes).trim(): '',
          projectId: projectId || '',
          ...(attended!==undefined? {attended} : {}),
        });
      }
      if(importedRows.length === 0){
        toast('لا يمكن استيراد الملف — لم يتم العثور على أي صفوف صالحة (تأكد من وجود عمود الاسم)', true);
        return;
      }
      renderImportPreview();
    }catch(err){
      toast('تعذر قراءة الملف، تأكد من الصيغة', true);
    }
  };
  reader.readAsBinaryString(file);
}
function renderImportPreview(){
  const box = document.getElementById('import-preview');
  if(importedRows.length===0){ box.innerHTML = `<div class="empty-note">لم يتم العثور على صفوف صالحة</div>`; return; }
  box.innerHTML = `
    <div style="margin-top:18px;">
      <div class="panel-head"><h3>معاينة البيانات (${importedRows.length} صف)</h3></div>
      <div class="table-wrap" style="max-height:280px; overflow-y:auto;">
        <table class="table">
          <thead><tr><th>الاسم</th><th>الجوال</th><th>التاريخ</th><th>الوقت</th><th>المشروع</th></tr></thead>
          <tbody>
            ${importedRows.slice(0,50).map(r=>`<tr>
              <td>${escapeHtml(r.name)}</td>
              <td style="direction:ltr;text-align:right">${escapeHtml(r.phone)}</td>
              <td>${escapeHtml(r.date)}</td>
              <td>${escapeHtml(r.time)}</td>
              <td>${escapeHtml((projectById(r.projectId)||{}).name || '— غير محدد —')}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="confirmImport()">${ICON.upload}<span>تأكيد استيراد ${importedRows.length} معاينة</span></button>
    </div>
  `;
}
async function confirmImport(){
  const rows = importedRows.filter(r=>r.projectId);
  if(rows.length===0){ toast('حدد مشروعًا لكل صف أولًا', true); return; }
  await bulkAddViewings(rows);
  importedRows = [];
  toast('تم استيراد البيانات بنجاح');
  document.getElementById('import-preview').innerHTML='';
  document.getElementById('file-input').value='';
  renderAdminTabContent();
}

/* ---- admin lock ---- */
function renderAdminLock(){
  document.getElementById('app').innerHTML = `
    <div class="admin-lock">
      <div class="lock-box">
        <div class="brand-mark" style="width:56px;height:56px;"><img src="${LOGO_SRC}" alt="دار وإعمار"></div>
        <h3>دخول لوحة التحكم</h3>
        <p>هذه الصفحة مخصصة لفريق دار وإعمار فقط</p>
        <form id="lockform">
          <input type="password" id="lock-input" placeholder="رمز الدخول" autocomplete="off">
          <div class="lock-err" id="lock-err"></div>
          <button type="submit" class="btn btn-primary btn-block" style="margin-top:14px;">${ICON.lock}<span>دخول</span></button>
          <button type="button" class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="goto('home')">رجوع للموقع</button>
        </form>
      </div>
    </div>`;
  document.getElementById('lockform').onsubmit = (e)=>{
    e.preventDefault();
    const val = document.getElementById('lock-input').value;
    if(val === ADMIN_PASSCODE){
      State.adminAuthed = true;
      sessionStorage.setItem('dar_admin_ok','1');
      render();
    } else {
      document.getElementById('lock-err').textContent = 'رمز الدخول غير صحيح';
    }
  };
}
function adminLogout(){
  State.adminAuthed = false;
  sessionStorage.removeItem('dar_admin_ok');
  goto('home');
}

/* ================= MAIN RENDER ================= */
function render(){
  if(!State.ready){
    document.getElementById('app').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--ink-300);font-size:13px;">جاري التحميل…</div>`;
    return;
  }
  if(State.route==='home') renderHome();
  else if(State.route==='projects') renderProjects();
  else if(State.route==='project') renderProjectDetail();
  else if(State.route==='admin') renderAdmin();
  else renderHome();
}

/* ================= INIT ================= */
handleHash();
initStore();
</script>
</body>
</html>
